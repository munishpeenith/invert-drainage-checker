[project]
name = "invert"
version = "0.1.0"
description = "Rule-driven checker for UK drainage drawings"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    # Indirect, via pdfminer.six. Pinned because cryptography 49 and later ship
    # no prebuilt wheel for Intel macOS, so pip falls back to compiling from
    # source and needs a Rust toolchain. 48 has a universal2 wheel.
    "cryptography<49",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "reportlab>=4.1",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
server = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.scripts]
invert = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["extract", "parse", "rules", "check", "report", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
